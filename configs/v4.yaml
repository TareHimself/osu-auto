# joint_v4: v3_all.json in one skin, synthetic maps from the synth: runs below. Paths are relative to the repo root.
#   uv run python -m osu_auto.synth --config ../configs/v4.yaml
#   uv run python -m osu_auto.maps --fetch ../data/jobs/v3_all.json
#   uv run python -m osu_auto.export_jobs --config ../configs/v4.yaml
#   uv run python -m osu_auto.train_joint --config ../configs/v4.yaml
# Training flags left out here use train_joint's defaults.

synth:
  - families: jumps,sliders,streams,dense,chains,patterns
  - families: mixed
    seeds: 2
  - families: spinners
    cs: 4
    seeds: 2

export:
  jobs: data/jobs/v3_all.json
  out: data/exports_v3
  list: data/jobs/train_v4.txt
  workers: 5
  skin: data/skins/YOUR_SKIN.osk  # your skin here; list several to train on several

train:
  exports: data/jobs/train_v4.txt
  out: data/models/joint_v4
  epochs: 40
  wandb: osu-auto
