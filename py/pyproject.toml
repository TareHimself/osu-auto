[project]
name = "osu-auto"
version = "0.1.0"
description = "osu-auto: maps, data export, training and evaluation for a pixels-only osu! agent"
readme = "README.md"
authors = [
    { name = "Oyintare Ebelo", email = "75279482+TareHimself@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "msgpack>=1.2.3",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime-gpu>=1.31.0",
    "onnxscript>=0.7.2",
    "opencv-python-headless>=5.0.0.93",
    "pywin32>=312",
    "pyyaml>=6.0.3",
    "pyzmq>=27.2.0",
    "torch>=2.14.1",
    "wandb>=0.31.0",
    "windows-capture>=2.0.1",
    "zstandard>=0.25.0",
]

[project.scripts]
osu-auto-plot = "osu_auto.plot_labels:main"

[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
